<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="shieldBg" x1="36" y1="36" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="rimStroke" x1="36" y1="36" x2="220" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="55%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <linearGradient id="goldCore" x1="112" y1="112" x2="144" y2="144" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>

  <!-- Octagonal Astrolabe Shield Plate (10%+ outer margin kept clear) -->
  <polygon
    points="166,36 220,90 220,166 166,220 90,220 36,166 36,90 90,36"
    fill="url(#shieldBg)"
    stroke="url(#rimStroke)"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Inner Tactical Octagon Accent -->
  <polygon
    points="161,48 208,95 208,161 161,208 95,208 48,161 48,95 95,48"
    stroke="#38BDF8"
    stroke-opacity="0.28"
    stroke-width="1.5"
    stroke-linejoin="round"
  />

  <!-- Astrolabe Star Orbit Rings -->
  <circle cx="128" cy="128" r="64" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="2" stroke-dasharray="6 5" />
  <ellipse cx="128" cy="128" rx="68" ry="26" transform="rotate(-30 128 128)" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="2" />
  <ellipse cx="128" cy="128" rx="68" ry="26" transform="rotate(30 128 128)" stroke="#F59E0B" stroke-opacity="0.45" stroke-width="2" />

  <!-- Tree-of-Thoughts Tri-Branching Paths & Fork Sub-Branches -->
  <!-- Primary Branches from Core -->
  <path d="M128 128 L128 66" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
  <path d="M128 128 L76 158" stroke="#38BDF8" stroke-width="4.5" stroke-linecap="round" />
  <path d="M128 128 L180 158" stroke="#F59E0B" stroke-width="5" stroke-linecap="round" />

  <!-- Hot-Fork Convergence & Pruning Stems -->
  <path d="M128 66 L104 54" stroke="#94A3B8" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4" />
  <path d="M128 66 L152 54" stroke="#38BDF8" stroke-width="3" stroke-linecap="round" />
  <path d="M180 158 L194 182" stroke="#F59E0B" stroke-width="3.5" stroke-linecap="round" />
  <path d="M76 158 L60 180" stroke="#94A3B8" stroke-opacity="0.6" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="3 4" />

  <!-- Outer Cognitive Operator Nodes -->
  <circle cx="128" cy="66" r="9" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
  <circle cx="152" cy="54" r="5" fill="#38BDF8" />

  <circle cx="76" cy="158" r="9" fill="#0F172A" stroke="#38BDF8" stroke-width="4" />
  <circle cx="180" cy="158" r="10" fill="#0F172A" stroke="#F59E0B" stroke-width="4.5" />
  <circle cx="194" cy="182" r="5.5" fill="#FBBF24" />

  <!-- Central Strategist Core Node -->
  <circle cx="128" cy="128" r="19" fill="#0F172A" stroke="#F59E0B" stroke-width="4" />
  <circle cx="128" cy="128" r="10" fill="url(#goldCore)" />
  <circle cx="128" cy="128" r="3.5" fill="#FFFBEB" />
</svg>
